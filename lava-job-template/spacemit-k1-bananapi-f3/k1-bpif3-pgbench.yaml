job_name: ${job_name}
timeouts:
  job:
    minutes: 10250
  action:
   minutes: 10249
  actions:
    power-off:
      seconds: 60
priority: medium
visibility: public
metadata:
  # please change these fields when modifying this job for your own tests.
  format: Lava-Test Test Definition 1.0
  name: spacemit-k1-bananapi-f3-test
  description: "test for spacemit-k1-bananapi-f3"
  version: "1.0"
protocols:
  lava-multinode:
    roles:
      server:
        device_type: spacemit-k1-bananapi-f3
        count: 1
        essential: True
      client:
        device_type: spacemit-k1-bananapi-f3
        count: 1
    timeout:
      minutes: 10249
# ACTION_BLOCK
actions:
# DEPLOY_BLOCK
- deploy:
    role:
      - server
      - client
    timeout:
      minutes: 120
    to: tftp
    dtb:
      url: ${dtb_url}
    kernel:
      url: ${kernel_image_url}
    ramdisk:
      url: ${ramdisk_url}
      install_overlay: False
      install_modules: False
    nfsrootfs:
      url: ${rootfs_image_url}
      compression: gz
# BOOT_BLOCK
- boot:
    role:
      - server
      - client
    timeout:
      minutes: 30
    method: u-boot
    commands: nfs
    prompts: ["root@riscv64", "login:", "Password:"]
    auto_login:
      login_prompt: "(.*)riscv64 login:(.*)"
      username: root
      password_prompt: "Password:"
      password: openEuler12#$
# TEST_BLOCK
- test:
    role:
      - server
    timeout:
      minutes: 10099
    definitions:
      - repository: ${testcase_repo}
        from: git
        name: ${testitem_name}
        path: ${testcase_path}
- test:
    role:
      - client
    timeout:
      minutes: 10099
    definitions:
      - repository: ${testcase_repo}
        from: git
        name: ${testitem_name}
        path: ${testcase_path}
        parameters:
          CLIENT: ${client}
          JOBS: ${jobs}
          TIME: ${time}