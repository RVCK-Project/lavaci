device_type: spacemit-k3
job_name: ${job_name}
timeouts:
  job:
    minutes: 10300
  action:
   minutes: 10299
  actions:
    power-off:
      seconds: 60
priority: medium
visibility: public
metadata:
  # please change these fields when modifying this job for your own tests.
  format: Lava-Test Test Definition 1.0
  name: spacemit-k3-test
  description: "test for spacemit-k3"
  version: "1.0"
# ACTION_BLOCK
actions:
# DEPLOY_BLOCK
- deploy:
    timeout:
      minutes: 120
    to: tftp
    dtb:
      url: ${dtb_url}
    kernel:
      url: ${kernel_image_url}
      type: image
    ramdisk:
      url: ${ramdisk_url}
      install_overlay: False
      install_modules: False
    nfsrootfs:
      url: ${rootfs_image_url}
      compression: gz
# BOOT_BLOCK
- boot:
    timeout:
      minutes: 30
    method: u-boot
    commands: nfs
    prompts: ["root@riscv64"]
    auto_login:
      login_prompt: "riscv64 login:"
      username: root
      password_prompt: "Password:"
      password: openEuler12#$
# TEST_BLOCK
- test:
      timeout:
        minutes: 10149
      definitions:
        - repository: ${testcase_repo}
          from: git
          name: ${testitem_name}
          path: ${testcase_path}
          parameters:
            TEST_DURATION: ${duration_hour}