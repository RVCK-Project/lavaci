metadata:
  name: jmh
  format: "Lava-Test Test Definition 1.0"
  description: "Run fio on RISC-V device"
  maintainer:
    - wujie22@iscas.ac.cn
  os:
    - openEuler-riscv64
  scope:
      - performance
  devices:
    - qemu
    - lpi4a
    - sg2042
    - spacemit-k1-bananapi-f3
    - spacemit-k3
params:
  WARMUP_ITERATIONS: 5
  MEASUREMENT_ITERATIONS: 10
  FORKS: 1
  THREADS: 4
run:
  steps:
    - cd lava-testcases/performance-test/jmh
    - bash jmh.sh -w "${WARMUP_ITERATIONS}" -i "${MEASUREMENT_ITERATIONS}" -f "${FORKS}" -t "${THREADS}"
    - chmod +x ../../utils/send-to-lava.sh
    - ../../utils/send-to-lava.sh ./output/result.txt